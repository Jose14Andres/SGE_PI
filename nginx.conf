server {
    listen 80;
    server_name localhost;

    # Security Headers (ISO/IEC 38500 Principio 5 Conformidad)
    add_header X-Frame-Options "DENY";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:;";

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Redireccionar todo el tráfico al index.html para soportar React Router v6+ (SPA)
        try_files $uri $uri/ /index.html;
    }

    # Caché estática para mejorar el performance
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        root /usr/share/nginx/html;
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }
}
