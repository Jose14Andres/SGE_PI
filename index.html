<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SGE — Sistema de Gestión Academica</title>
  <meta name="description"
    content="Sistema de Gestión Educativa institucional para administración de alumnos, profesores, cursos y materias." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              950: '#060d1f',
              900: '#0f172a',
              800: '#1e293b',
              700: '#334155',
            },
            accent: {
              DEFAULT: '#4f46e5',
              light: '#6366f1',
              dark: '#3730a3',
            },
            gold: {
              DEFAULT: '#f59e0b',
              light: '#fbbf24',
              dark: '#d97706',
            }
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"DM Sans"', 'system-ui', 'sans-serif'],
          },
          backdropBlur: {
            xs: '2px',
          },
          animation: {
            'fade-in': 'fadeIn 0.2s ease-out',
            'slide-in': 'slideIn 0.2s ease-out',
            'toast-in': 'toastIn 0.3s ease-out',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideIn: { '0%': { opacity: '0', transform: 'translateY(-8px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
            toastIn: { '0%': { opacity: '0', transform: 'translateX(100%)' }, '100%': { opacity: '1', transform: 'translateX(0)' } },
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0B132B;
    }

    /* Subtle grid texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    #root {
      position: relative;
      z-index: 1;
    }

    * {
      box-sizing: border-box;
    }

    ::-webkit-scrollbar {
      width: 6px; height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #1C2541;
    }

    ::-webkit-scrollbar-thumb {
      background: #0052CC;
      border-radius: 3px;
    }
  </style>
</head>

<body class="min-h-screen font-sans text-slate-200">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
