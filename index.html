<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SGE — Sistema de Gestión Academica</title>
  <meta name="description"
    content="Sistema de Gestión Educativa institucional para administración de alumnos, profesores, cursos y materias." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // Paleta de marca: mantener sincronizada con las variables --netflix-* de :root
            netflix: {
              red: '#E50914',        // CTAs principales, progreso, estados activos
              'red-dark': '#B20710', // hover / activo de los CTAs
              black: '#000000',
              bg: '#141414',         // canvas
              surface: '#181818',    // tarjetas, modales
              border: '#2F2F2F',
              primary: '#FFFFFF',    // texto principal
              secondary: '#B3B3B3',  // descripciones, metadatos
              muted: '#808080',      // deshabilitado / sutil
            },
            gold: {
              DEFAULT: '#f59e0b',
              light: '#fbbf24',
              dark: '#d97706',
            }
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"DM Sans"', 'system-ui', 'sans-serif'],
          },
          backdropBlur: {
            xs: '2px',
          },
          animation: {
            'fade-in': 'fadeIn 0.2s ease-out',
            'slide-in': 'slideIn 0.2s ease-out',
            'toast-in': 'toastIn 0.3s ease-out',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideIn: { '0%': { opacity: '0', transform: 'translateY(-8px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
            toastIn: { '0%': { opacity: '0', transform: 'translateX(100%)' }, '100%': { opacity: '1', transform: 'translateX(0)' } },
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --netflix-red: #E50914;
      --netflix-red-dark: #B20710;
      --netflix-black: #000000;
      --netflix-bg: #141414;
      --netflix-surface: #181818;
      --netflix-border: #2F2F2F;
      --netflix-text-primary: #FFFFFF;
      --netflix-text-secondary: #B3B3B3;
      --netflix-text-muted: #808080;
      color-scheme: dark;
    }

    body {
      background-color: var(--netflix-bg);
      color: var(--netflix-text-primary);
    }

    #root {
      position: relative;
      z-index: 1;
    }

    * {
      box-sizing: border-box;
    }

    ::-webkit-scrollbar {
      width: 6px; height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--netflix-bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--netflix-border);
      border-radius: 3px;
    }
  </style>
</head>

<body class="min-h-screen font-sans text-netflix-primary">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
